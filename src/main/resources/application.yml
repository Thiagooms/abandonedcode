spring:
  application:
    name: abandonedcode

  datasource:
    url: jdbc:postgresql://localhost:5432/abandonedcode
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    validate-on-migrate: true
    out-of-order: false

server:
  port: 8080

logging:
  level:
    com.thiago.abandonedcode: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha